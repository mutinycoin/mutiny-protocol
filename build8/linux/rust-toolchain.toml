# Pinned build toolchain for every Mutiny Build 8 crate (consensus, node, crypto-v2,
# transport-v2, desktop, release-signer and wallet-core; desktop and release-signer were
# imported from the original checkout in 121479b). The version is the exact rustc the Build 8
# tests were run with (rustc 1.98.1 48a229cea 2026-09-01). "minimal" keeps the toolchain free
# of extras. Some hosts name this same 1.98.1 toolchain "stable" and have none named 1.98.1;
# there, builds set RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-msvc (and record it).
# The Linux target is declared so a Linux validator build resolves the same compiler;
# it has NOT yet been built on Linux (see docs/BUILD-CONFIGURATIONS-V1.md).
[toolchain]
channel = "1.98.1"
profile = "minimal"
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
