[package]
name = "mutiny-treasury-continuity-service-probe-v1"
version = "0.1.0"
edition = "2024"
publish = false

# Nonshipping qualification adapter; no server executable or feature registration.
[workspace]
[dependencies]
mutiny-consensus-v8 = { path = "../../consensus" }
mutiny-crypto-v2 = { path = "../../crypto-v2" }
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[patch.crates-io]
hkdf = { path = "../crypto-v2-sources/kdf-custody-v1/hkdf" }
hmac = { path = "../crypto-v2-sources/kdf-custody-v1/hmac" }
sha2 = { path = "../crypto-v2-sources/kdf-custody-v1/sha2" }
block-buffer = { path = "../crypto-v2-sources/kdf-custody-v1/block-buffer" }
pbkdf2 = { path = "../crypto-v2-sources/kdf-custody-v1/pbkdf2" }
argon2 = { path = "../crypto-v2-sources/kdf-custody-v1/argon2" }
blake2 = { path = "../crypto-v2-sources/kdf-custody-v1/blake2" }

[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = false
codegen-units = 1
strip = "none"
lto = false
panic = "unwind"
