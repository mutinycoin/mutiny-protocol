# Mutiny Protocol Build 8: chrony NTS source configuration TEMPLATE (clock profile V1).
#
# STATUS: configuration RECORD for qualification work. It is NOT a qualified configuration:
# no hardware class is qualified, and every item marked UNVERIFIED must be confirmed by a live
# NTS-KE exchange and operator contact before this file is frozen (docs/CLOCK-PROFILE-V1.md).
#
# Approved initial NTS source set (Architect, 2026-10-03): Cloudflare, Netnod, PTB, SIDN (time.nl).
# Exactly ONE hostname per operator below. Several addresses or hostnames of one operator are NOT
# independent operators; the node validates at least 3 distinct operators
# (node/src/host_clock/nts_sources.rs). Endpoint facts are as read on the operators' own pages on
# 2026-10-03 (docs/d1-clock-profile/NTS-SOURCE-SET-ASSESSMENT-V1.md).
#
# AUTHENTICATION: every source uses `nts` (RFC 8915). Plain NTP sources are never configured.
# NTS authenticates who sent the time and that it was not modified; it does NOT prove the
# uncertainty bound and agreement of sources does not either.
#
# Do NOT add `pool`, `peer`, `smoothtime` or `leapsectz` lines (rejected by the validator): a pool
# can span operators, smoothing/smearing is not POSIX-step time, and a local leap table is an
# unauthenticated schedule (Architect decision pending).

# --- Cloudflare (Cloudflare, Inc., USA; anycast; AS13335 per PeeringDB) ---------------------------
# Hostname VERIFIED (developers.cloudflare.com/time-services/nts/). Leap behaviour VERIFIED: no
# smearing, leap indicator then kernel step (developers.cloudflare.com/time-services/ntp/).
# NTS-KE PORT UNVERIFIED/CONFLICTING: 2019 blog says 1234, cfnts repo default is 4460. chrony uses
# its default NTS-KE port 4460 unless told otherwise; confirm with a live NTS-KE test and, if the
# service uses another port, add the chrony option for the NTS-KE port here. AEAD UNVERIFIED.
server time.cloudflare.com iburst nts

# --- Netnod (Netnod, Sweden; AS57021) ------------------------------------------------------------
# Hostname and NTS-KE port 4460/TCP VERIFIED (netnod.se/nts/network-time-security). NTP/NTS data
# runs on UDP 4123, NOT 123 (netnod.se/netnod-time/how-to-use-nts): allow UDP 4123 outbound.
# Whether the NTS-KE record hands out 4123 for this hostname is UNVERIFIED (needs live capture).
# LEAP BEHAVIOUR UNVERIFIED (no statement found); smearing cannot be excluded until the operator
# confirms in writing or it is observed at a leap event. Regional names (e.g. sth1.nts.netnod.se)
# exist but are the SAME operator and add no independence.
server nts.netnod.se iburst nts

# --- PTB (Physikalisch-Technische Bundesanstalt, Germany) ----------------------------------------
# Hostname and ports VERIFIED (zeit.ptb.de/files/ptb-ntp-services.json): NTS-KE 4460/TCP, NTP
# 123/UDP, TLS >= 1.3, certificates from Let's Encrypt. Stratum value UNVERIFIED (not published).
# LEAP BEHAVIOUR UNVERIFIED (not stated; chrony is used but its smoothing configuration is not
# published). ptbtime2/3/4 are the same operator.
server ptbtime1.ptb.de iburst nts

# --- SIDN Labs (time.nl, Netherlands) ------------------------------------------------------------
# Production hostnames ntppool1/ntppool2 VERIFIED (nts.time.nl, time.nl); stratum 1; Galileo+GPS
# primary, DCF77 + rubidium holdover. Leap behaviour VERIFIED: no leap smearing (time.nl).
# NTS-KE PORT UNVERIFIED (default 4460 expected, not stated). AEAD UNVERIFIED. Do NOT use
# ntspool.time.nl (pool name), nts1.time.nl (pilot), any.time.nl or ntppool3/4 (pre-production).
# Service is labelled experimental; use is at the user's own risk (operator terms).
server ntppool1.time.nl iburst nts

# --- Selection and leap policy -------------------------------------------------------------------
# Require that a source be NTS-authenticated to be selected (chrony >= 4.0; version of the target
# chrony UNVERIFIED) and that at least three sources (= three operators here) agree.
authselectmode require
minsources 3

# Administrator preparation only: reconcile the effective configuration before
# deployment. Ordinary-user monitoring never changes the privileged Unix socket.
# Supported matching chronyd/chronyc >=4.7; current parser qualified schemas 4.7/4.8.
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
cmdport 323
opencommands tracking sources sourcestats authdata ntpdata selectdata sourcename

# POSIX-step leap handling is a declared HOST PRECONDITION of clock profile V1: the OS clock steps
# at the leap second. `slew`, `step` or `ignore` are not accepted by the validator for this profile.
# The node derives its ambiguous zone [T - 1 s, T) around the month-end boundary T from exactly this
# step (docs/CLOCK-PROFILE-V1.md section 4.1) and adds NO blanket allowance to samples outside it;
# a mode that slews or smears would make that derivation false. How early before the event chrony
# raises the leap indicator on the target version is UNVERIFIED (a live-qualification gate).
leapsecmode system

# NTS cookies/keys across restarts (path is a deployment choice).
ntsdumpdir /var/lib/chrony
